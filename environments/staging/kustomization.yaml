apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- namespace.yaml
- project-persistentvolume.yaml
- project-persistentvolumeclaim.yaml
- ../../project/base
- ../../todo-backend/base
- ../../todo-fetcher/base
- ../../broadcaster/base

images:
- name: eerola/broadcaster
  newName: eerola/broadcaster
  newTag: 1c27ba84996349a4fd368e14b21bb24ddd56ca22
- name: eerola/todo-app
  newName: eerola/todo-app
  newTag: 1c27ba84996349a4fd368e14b21bb24ddd56ca22
- name: eerola/todo-backend
  newName: eerola/todo-backend
  newTag: 1c27ba84996349a4fd368e14b21bb24ddd56ca22
- name: eerola/todo-fetcher
  newName: eerola/todo-fetcher
  newTag: 1c27ba84996349a4fd368e14b21bb24ddd56ca22

patches:
- patch: |-
    - op: add
      path: /spec/rules/0/host
      value: staging.localhost
  target:
    kind: Ingress
    name: project-ingress
