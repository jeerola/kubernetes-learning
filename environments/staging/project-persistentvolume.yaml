apiVersion: v1
kind: PersistentVolume
metadata:
  name: project-pv-staging
spec:
  storageClassName: project-pv-staging
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  local:
    path: /tmp/kube/staging
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-gitops-server-0