apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: project
  name: todo-fetcher
spec:
  schedule: "0 * * * *" # cron expression for "every hour"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: todo-fetcher
              image: eerola/todo-fetcher:3.5
              env:
                - name: WIKIPEDIA_URL
                  value: "https://en.wikipedia.org/wiki/Special:Random"
          restartPolicy: OnFailure
