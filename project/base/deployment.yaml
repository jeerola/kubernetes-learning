apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: project-pv
          persistentVolumeClaim:
            claimName: project-claim
      containers:
      - name: todo-app
        image: eerola/todo-app:4.2
        resources:
          requests:
            cpu: "10m"
            memory: "48Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: project-pv
          mountPath: /usr/src/app/project
        imagePullPolicy: Always
        env:
          - name: PORT
            value: "3000"
          - name: IMAGE_URL
            value: "https://picsum.photos/200/300"
