name: Log output release

on:
  push:
    branches: [main]
    paths: ["log-output/**"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          for app in writer reader; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t eerola/log-output-$app:$GITHUB_SHA --push ./log-output/log-output-$app
          done

      - uses: imranismail/setup-kustomize@v3
      - name: Set images
        working-directory: log-output
        run: |
          kustomize edit set image eerola/log-output-writer=eerola/log-output-writer:$GITHUB_SHA
          kustomize edit set image eerola/log-output-reader=eerola/log-output-reader:$GITHUB_SHA

      - uses: EndBug/add-and-commit@v10
        with:
          add: log-output/kustomization.yaml
          message: "Release ${{ github.sha }}"